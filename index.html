<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generator with Duration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, input[type="number"], input[type="text"] {
            padding: 6px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            color: #24292f;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="number"]:focus, input[type="text"]:focus {
            border-color: #0969da;
            background-color: #ffffff;
        }

        input[type="number"] {
            width: 80px;
        }

        .hint-text {
            font-size: 12px;
            color: #57606a;
            margin-top: 8px;
        }

        .btn {
            background-color: #2da44e;
            color: white;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2c974b;
        }

        .result-group {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #d0d7de;
        }

        .key-display {
            width: 100%;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            color: #0969da;
            background-color: #ddf4ff;
            border-color: #0969da;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ส่วนเลือกระยะเวลา -->
        <div class="form-group">
            <label for="durationType">กำหนดระยะเวลาของ Key</label>
            <div class="input-group">
                <select id="durationType" onchange="updateDurationLogic()">
                    <option value="hour">ชั่วโมง</option>
                    <option value="day">วัน</option>
                    <option value="month">เดือน</option>
                    <option value="permanent">ถาวร</option>
                </select>

                <input type="number" id="durationValue" min="1" max="12" value="1" oninput="enforceMaxValue(this)">
                <span id="unitText" style="font-size: 14px;">ชั่วโมง</span>
            </div>
            <div class="hint-text" id="hintText">กรุณาระบุตั้งแต่ 1 ถึง 12 ชั่วโมง</div>
        </div>

        <!-- ปุ่มสร้างคีย์ -->
        <button class="btn" onclick="generateKey()">สร้างคีย์ (Generate Key)</button>

        <!-- ส่วนแสดงผลคีย์ที่สร้าง -->
        <div class="result-group">
            <label for="generatedKey">คีย์ที่สร้างสำเร็จ (12-20 ตัวอักษร):</label>
            <input type="text" id="generatedKey" class="key-display" readonly placeholder="XXXX-XXXX-XXXX">
        </div>
    </div>

    <script>
        const durationRules = {
            hour: { max: 12, unit: "ชั่วโมง", hint: "กรุณาระบุตั้งแต่ 1 ถึง 12 ชั่วโมง", code: "H" },
            day: { max: 30, unit: "วัน", hint: "กรุณาระบุตั้งแต่ 1 ถึง 30 วัน", code: "D" },
            month: { max: 12, unit: "เดือน", hint: "กรุณาระบุตั้งแต่ 1 ถึง 12 เดือน", code: "M" }
        };

        function updateDurationLogic() {
            const type = document.getElementById("durationType").value;
            const input = document.getElementById("durationValue");
            const unitText = document.getElementById("unitText");
            const hintText = document.getElementById("hintText");

            if (type === "permanent") {
                input.style.display = "none";
                unitText.style.display = "none";
                hintText.textContent = "สิทธิ์การใช้งานแบบไม่มีวันหมดอายุ (รหัส: PERM)";
            } else {
                const rules = durationRules[type];
                input.style.display = "block";
                unitText.style.display = "block";
                input.max = rules.max;
                unitText.textContent = rules.unit;
                hintText.textContent = rules.hint + ` (รหัส: ${rules.code})`;

                if (parseInt(input.value) > rules.max) input.value = rules.max;
                if (parseInt(input.value) < 1 || !input.value) input.value = 1;
            }
        }

        function enforceMaxValue(element) {
            const type = document.getElementById("durationType").value;
            if (type === "permanent") return;

            const max = durationRules[type].max;
            let val = parseInt(element.value);

            if (val > max) element.value = max;
            else if (val < 1) element.value = 1;
        }

        function generateKey() {
            const type = document.getElementById("durationType").value;
            const value = document.getElementById("durationValue").value;
            
            // 1. สร้างรหัสแทรก (Duration Code)
            let durationCode = "";
            if (type === "permanent") {
                durationCode = "PERM";
            } else {
                durationCode = durationRules[type].code + value;
            }

            // 2. สุ่มความยาวรวมของ Key ให้ได้ 12 - 20 ตัว
            const totalLength = Math.floor(Math.random() * (20 - 12 + 1)) + 12;
            
            // 3. คำนวณหาจำนวนตัวอักษรที่ต้องสุ่มเพิ่ม (หักลบกับความยาวของ Duration Code แล้ว)
            const randomLength = totalLength - durationCode.length;

            // ชุดตัวอักษรสำหรับสุ่ม (A-Z และ 0-9)
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            
            let randomPart1 = "";
            let randomPart2 = "";
            
            // แบ่งตัวอักษรสุ่มออกเป็น 2 ส่วน เพื่อเอา Duration Code ไปแทรกไว้ตรงกลาง
            const splitIndex = Math.floor(randomLength / 2);
            
            for (let i = 0; i < splitIndex; i++) {
                randomPart1 += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            for (let i = splitIndex; i < randomLength; i++) {
                randomPart2 += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // 4. นำมารวมกัน คีย์ที่ได้จะมีความยาว 12-20 ตัวเป๊ะตามที่กำหนด
            const finalKey = randomPart1 + durationCode + randomPart2;
            
            // แสดงผลลัพธ์
            document.getElementById("generatedKey").value = finalKey;
        }
    </script>

</body>
</html>
