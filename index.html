<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL KEYGEN_</title>
    <!-- นำเข้าฟอนต์สไตล์ Retro Terminal -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ตั้งค่าสีพื้นฐาน ดำ-เขียว */
        :root {
            --term-bg: #000000;
            --term-fg: #00ff00;
            --term-glow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--term-bg);
            color: var(--term-fg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* เอฟเฟกต์เส้นจอมอนิเตอร์แบบบางๆ (Scanlines) */
            background-image: linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 2px 2px;
        }

        .card {
            background: var(--term-bg);
            border: 2px solid var(--term-fg);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--term-glow);
            position: relative;
        }

        /* แต่งขอบการ์ดให้ดูเหมือนหน้าต่าง Terminal */
        .card::before {
            content: "N-LITE // SYS.KEYGEN";
            position: absolute;
            top: -12px;
            left: 10px;
            background: var(--term-bg);
            padding: 0 10px;
            font-size: 20px;
            text-shadow: var(--term-glow);
        }

        .form-group {
            margin-bottom: 25px;
            margin-top: 15px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 22px;
            text-shadow: var(--term-glow);
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select, input[type="number"], input[type="text"] {
            padding: 8px 12px;
            font-size: 22px;
            font-family: 'VT323', monospace;
            border: 1px solid var(--term-fg);
            background-color: var(--term-bg);
            color: var(--term-fg);
            outline: none;
            box-shadow: var(--term-glow);
            transition: all 0.2s;
        }

        select {
            cursor: pointer;
        }

        select:focus, input[type="number"]:focus, input[type="text"]:focus {
            background-color: #001a00;
            border-width: 2px;
        }

        input[type="number"] {
            width: 70px;
            text-align: center;
        }

        /* ซ่อนลูกศรในช่องตัวเลข */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .hint-text {
            font-size: 18px;
            color: #00aa00;
            margin-top: 10px;
        }

        .btn {
            background-color: var(--term-bg);
            color: var(--term-fg);
            border: 2px solid var(--term-fg);
            padding: 10px 16px;
            font-size: 24px;
            font-family: 'VT323', monospace;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: var(--term-glow);
            transition: all 0.2s;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .btn:hover {
            background-color: var(--term-fg);
            color: var(--term-bg);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .btn:active {
            transform: translateY(2px);
        }

        .result-group {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--term-fg);
        }

        .key-display {
            width: 100%;
            font-size: 28px;
            text-align: center;
            letter-spacing: 3px;
            background-color: #001100;
            border: 2px solid var(--term-fg);
            padding: 15px;
            box-sizing: border-box;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ส่วนเลือกระยะเวลา -->
        <div class="form-group">
            <label for="durationType">> SET_DURATION <span class="cursor-blink">_</span></label>
            <div class="input-group">
                <select id="durationType" onchange="updateDurationLogic()">
                    <option value="hour">HOURS</option>
                    <option value="day">DAYS</option>
                    <option value="month">MONTHS</option>
                    <option value="permanent">PERMANENT</option>
                </select>

                <input type="number" id="durationValue" min="1" max="12" value="1" oninput="enforceMaxValue(this)">
                <span id="unitText" style="font-size: 22px;">HRS</span>
            </div>
            <div class="hint-text" id="hintText">>> RANGE: [1 - 12] (CODE: H)</div>
        </div>

        <!-- ปุ่มสร้างคีย์ -->
        <button class="btn" onclick="generateKey()">[ EXECUTE KEYGEN ]</button>

        <!-- ส่วนแสดงผลคีย์ที่สร้าง -->
        <div class="result-group">
            <label for="generatedKey">> OUTPUT_KEY:</label>
            <input type="text" id="generatedKey" class="key-display" readonly placeholder="AWAITING INPUT...">
        </div>
    </div>

    <script>
        const durationRules = {
            hour: { max: 12, unit: "HRS", hint: ">> RANGE: [1 - 12]", code: "H" },
            day: { max: 30, unit: "DAYS", hint: ">> RANGE: [1 - 30]", code: "D" },
            month: { max: 12, unit: "MTHS", hint: ">> RANGE: [1 - 12]", code: "M" }
        };

        function updateDurationLogic() {
            const type = document.getElementById("durationType").value;
            const input = document.getElementById("durationValue");
            const unitText = document.getElementById("unitText");
            const hintText = document.getElementById("hintText");

            if (type === "permanent") {
                input.style.display = "none";
                unitText.style.display = "none";
                hintText.textContent = ">> STATUS: UNLIMITED (CODE: PERM)";
            } else {
                const rules = durationRules[type];
                input.style.display = "block";
                unitText.style.display = "block";
                input.max = rules.max;
                unitText.textContent = rules.unit;
                hintText.textContent = `${rules.hint} (CODE: ${rules.code})`;

                if (parseInt(input.value) > rules.max) input.value = rules.max;
                if (parseInt(input.value) < 1 || !input.value) input.value = 1;
            }
        }

        function enforceMaxValue(element) {
            const type = document.getElementById("durationType").value;
            if (type === "permanent") return;

            const max = durationRules[type].max;
            let val = parseInt(element.value);

            if (val > max) element.value = max;
            else if (val < 1) element.value = 1;
        }

        function generateKey() {
            const type = document.getElementById("durationType").value;
            const value = document.getElementById("durationValue").value;
            
            let durationCode = type === "permanent" ? "PERM" : durationRules[type].code + value;
            const totalLength = Math.floor(Math.random() * (20 - 12 + 1)) + 12;
            const randomLength = totalLength - durationCode.length;
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            
            let randomPart1 = "";
            let randomPart2 = "";
            const splitIndex = Math.floor(randomLength / 2);
            
            for (let i = 0; i < splitIndex; i++) {
                randomPart1 += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            for (let i = splitIndex; i < randomLength; i++) {
                randomPart2 += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            const finalKey = randomPart1 + durationCode + randomPart2;
            
            // เอฟเฟกต์กระพริบตอนสร้างเสร็จ (Hacker Vibe)
            const keyDisplay = document.getElementById("generatedKey");
            keyDisplay.style.backgroundColor = "#00ff00";
            keyDisplay.style.color = "#000000";
            
            setTimeout(() => {
                keyDisplay.style.backgroundColor = "#001100";
                keyDisplay.style.color = "#00ff00";
                keyDisplay.value = finalKey;
            }, 100);
        }

        // Initialize setup
        updateDurationLogic();
    </script>

</body>
</html>
